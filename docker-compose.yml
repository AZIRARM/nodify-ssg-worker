services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile-Worker
    ports:
      - "${WORKER_PORT:-5000}:5000"
    environment:
      - NODIFY_API_URL=${NODIFY_API_URL:-https://nodify-api.azirar.ovh}
      - WORKER_SECRET=${WORKER_SECRET:-}
      - SITES_DIR=/sites
    volumes:
      - ${SITES_VOLUME:-/dockers/nodify-ssg-worker/sites}:/sites
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: Dockerfile-Admin
    ports:
      - "${ADMIN_PORT:-8080}:8080"
    environment:
      - WORKER_URL=http://worker:5000
      - SITES_URL=${SITES_URL:-https://nodify-sites.azirar.ovh}
    volumes:
      - ${SITES_VOLUME:-/dockers/nodify-ssg-worker/sites}:/sites
    depends_on:
      - worker
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "${WEB_PORT:-3000}:80"
    volumes:
      - ${SITES_VOLUME:-/dockers/nodify-ssg-worker/sites}:/usr/share/nginx/html
    restart: unless-stopped
