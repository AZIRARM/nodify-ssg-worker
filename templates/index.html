<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nodify SSG Worker - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">
            <h1><i class="fas fa-code-branch"></i> Nodify SSG Worker</h1>
            <p>Static Site Generator • Headless CMS Webhook Receiver</p>
        </div>
        <div class="stats">
            <div class="stat-card">
                <i class="fas fa-folder"></i>
                <div class="label">Total Sites</div>
                <div class="value" id="totalSites">0</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-database"></i>
                <div class="label">Storage Used</div>
                <div class="value" id="totalSize">0 KB</div>
            </div>
        </div>
    </div>

    <div class="webhook-info">
        <h3><i class="fas fa-webhook"></i> Webhook Endpoint</h3>
        <code>POST /webhook</code>
        <div class="endpoint" id="webhookUrl"></div>
        <p style="margin-top: 12px; font-size: 12px; color: #94a3b8;">
            <i class="fas fa-info-circle"></i> Expected payload: {"client_payload": {"code": "NODE_CODE", "folder": "SITE_NAME"}}
        </p>
    </div>

    <div class="controls">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search sites...">
        </div>
        <button class="refresh-btn" onclick="loadSites()">
            <i class="fas fa-sync-alt"></i> Refresh
        </button>
    </div>

    <div class="sites-grid" id="sitesGrid">
        <div class="loading">
            <i class="fas fa-spinner"></i>
            <p>Loading sites...</p>
        </div>
    </div>

    <div class="footer">
        <p>Nodify SSG Worker • <a href="https://github.com/AZIRARM/nodify" target="_blank">GitHub</a> • <a href="https://nodify.azirar.ovh" target="_blank">Nodify CMS</a></p>
    </div>
</div>

<script>
    window.SITES_URL = '{{ sites_url }}';
</script>
<script src="/static/app.js"></script>
</body>
</html>
